name: Deploy para GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    name: Validação & Build
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
    steps:
      - name: 1. Checkout do repositório
        uses: actions/checkout@v4

      - name: 2. Setup do pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
          run_install: false

      - name: 3. Setup do Node.js com cache do pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 4. Instalação estrita de dependências
        run: pnpm install --frozen-lockfile

      - name: 5. Checagem de tipos TypeScript (tsc)
        run: pnpm typecheck

      - name: 6. Validação de lint (ESLint)
        run: pnpm lint

      - name: 7. Execução dos testes automatizados (Vitest)
        run: pnpm test:run

      - name: 8. Build do Projeto
        run: pnpm build

      - name: 9. Configuração do GitHub Pages
        uses: actions/configure-pages@v5

      - name: 10. Upload do artefato da pasta ./dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # Por enquanto só avisa: uma falha aqui não impede o deploy.
  # Para bloquear, remova continue-on-error e use needs: [build, e2e] no job deploy.
  e2e:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: 1. Checkout do repositório
        uses: actions/checkout@v4

      - name: 2. Setup do pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
          run_install: false

      - name: 3. Setup do Node.js com cache do pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 4. Instalação estrita de dependências
        run: pnpm install --frozen-lockfile

      - name: 5. Instalação do Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: 6. Execução dos testes E2E
        run: pnpm test:e2e

      - name: 7. Upload do relatório e dos traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    name: Publicação no GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 11. Publicação final no Pages
        id: deployment
        uses: actions/deploy-pages@v4
